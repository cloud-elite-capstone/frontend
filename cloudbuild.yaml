substitutions:
  _REPOSITORY: dev-repo
  _SERVICE_NAME: react-frontend

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['buildx', 'create', '--name', 'mybuilder', '--use']
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'buildx'
      - 'build'
      - '--builder'
      - 'mybuilder'
      - '--cache-from=type=registry,ref=$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:cache'
      - '--cache-to=type=registry,ref=$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:cache,mode=max'
      - '-t'
      - '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:latest'
      - '--push'
      - '.'
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:latest'
      - '--region'
      - '$LOCATION'
      - '--project'
      - '$PROJECT_ID'
      - '--async'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'