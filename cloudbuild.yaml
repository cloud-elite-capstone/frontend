steps:
  - name: 'gcr.io/k8s-skaffold/pack'
    args:
      - 'build'
      - '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/frontend:latest'
      - '--builder'
      - 'gcr.io/buildpacks/builder:google-22'
      - '--network'
      - 'cloudbuild'
      - '--publish'

options:
  logging: CLOUD_LOGGING_ONLY
